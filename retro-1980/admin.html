<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro 1980 - 관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Sunflower:wght@300;500;700&display=swap');
        body { font-family: 'Gowun Dodum', sans-serif; background:#2d3748; color:#e2e8f0; }
        .retro-card { background:#4a5568; border:2px solid #a0aec0; box-shadow:4px 4px 0 #1a202c; }
        .btn-retro { transition:all .1s; box-shadow:2px 2px 0 #000; }
        .btn-retro:active { transform:translate(2px,2px); box-shadow:none; }
        #login-overlay { position:fixed; inset:0; background:#1a202c; display:flex; justify-content:center; align-items:center; z-index:100; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div id="login-overlay">
        <div class="retro-card p-8 rounded max-w-sm w-full text-center bg-gray-700">
            <h1 class="text-2xl font-bold mb-4 text-yellow-400">🕵️ 관리자 인증</h1>
            <p class="mb-4 text-sm text-gray-300">Supabase 관리자 계정으로 로그인하세요.</p>
            <input type="email" id="admin-email" autocomplete="username" placeholder="관리자 이메일"
                class="w-full p-2 mb-3 bg-gray-800 border border-gray-600 rounded text-white">
            <input type="password" id="admin-pass" autocomplete="current-password" placeholder="비밀번호"
                class="w-full p-2 mb-4 bg-gray-800 border border-gray-600 rounded text-white">
            <button id="login-button" onclick="checkAuth()"
                class="btn-retro w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded border-2 border-blue-800">접속하기</button>
            <p id="login-error" class="text-red-300 text-sm mt-3 hidden"></p>
        </div>
    </div>

    <div id="admin-content" class="max-w-4xl mx-auto hidden">
        <header class="flex flex-wrap gap-3 justify-between items-center mb-8 pb-4 border-b border-gray-600">
            <h1 class="text-3xl font-bold text-white">🎛️ 레트로 사이트 관리소</h1>
            <div class="flex gap-3 items-center">
                <a href="index.html" class="text-gray-300 hover:text-white underline">사이트로 돌아가기</a>
                <button onclick="signOut()" class="text-sm px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">로그아웃</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="retro-card p-6 rounded">
                <h2 class="text-xl font-bold mb-4 text-green-400">📋 메뉴 관리</h2>
                <div id="menu-list" class="space-y-2 mb-4 h-64 overflow-y-auto pr-2">
                    <p class="text-center text-gray-500 py-4">데이터 로딩 중...</p>
                </div>
                <div class="mt-4 pt-4 border-t border-gray-500">
                    <h3 class="font-bold mb-2 text-sm text-gray-300">새 메뉴 추가</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                        <input type="text" id="new-menu-label" maxlength="60" placeholder="메뉴 이름"
                            class="p-2 bg-gray-800 border border-gray-600 rounded text-sm text-white">
                        <input type="text" id="new-menu-action" maxlength="50" placeholder="Action ID"
                            class="p-2 bg-gray-800 border border-gray-600 rounded text-sm text-white">
                    </div>
                    <button onclick="addMenuItem()"
                        class="btn-retro w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded text-sm border-2 border-green-800">+ 메뉴 추가</button>
                </div>
            </section>

            <section class="retro-card p-6 rounded">
                <h2 class="text-xl font-bold mb-4 text-purple-400">🖼️ 에셋 & 텍스트 관리</h2>
                <div class="space-y-8">
                    <div class="space-y-4 border-b border-gray-500 pb-6">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">메인 타이틀</label>
                            <div class="flex gap-2">
                                <input type="text" id="site-title-input" maxlength="120" class="flex-1 p-2 bg-gray-800 border border-gray-600 rounded text-white">
                                <button onclick="updateTextAsset('main_title', document.getElementById('site-title-input').value)" class="px-4 py-2 bg-purple-600 rounded font-bold text-xs">저장</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">서브 타이틀</label>
                            <div class="flex gap-2">
                                <input type="text" id="site-subtitle-input" maxlength="200" class="flex-1 p-2 bg-gray-800 border border-gray-600 rounded text-white">
                                <button onclick="updateTextAsset('main_subtitle', document.getElementById('site-subtitle-input').value)" class="px-4 py-2 bg-purple-600 rounded font-bold text-xs">저장</button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-gray-300 mb-4">이미지 교체</h3>
                        <div id="image-asset-list" class="space-y-4 h-96 overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <input type="file" id="global-file-input" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" onchange="handleFileSelect(this)">

    <script>
        const SUPABASE_URL = 'https://rcciivtbucjtrhzgeyds.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_F40YWB1fkqCWZcLlWzHyNA_rbaPfLaG';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
        let currentUploadKey = null;

        function showLoginError(message) {
            const el = document.getElementById('login-error');
            el.textContent = message;
            el.classList.toggle('hidden', !message);
        }

        function isAdminUser(user) {
            return user?.app_metadata?.role === 'admin';
        }

        async function checkAuth() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-pass').value;
            const button = document.getElementById('login-button');
            if (!email || !password) return showLoginError('이메일과 비밀번호를 입력하세요.');

            button.disabled = true;
            showLoginError('');
            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
            button.disabled = false;

            if (error) return showLoginError('로그인에 실패했습니다.');
            if (!isAdminUser(data.user)) {
                await sbClient.auth.signOut();
                return showLoginError('관리자 권한이 없는 계정입니다.');
            }
            openAdmin();
        }

        async function restoreSession() {
            const { data } = await sbClient.auth.getSession();
            const user = data.session?.user;
            if (isAdminUser(user)) openAdmin();
        }

        function openAdmin() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').classList.remove('hidden');
            loadData();
        }

        async function signOut() {
            await sbClient.auth.signOut();
            location.reload();
        }

        async function loadData() {
            await Promise.all([loadMenuItems(), loadSiteAssets()]);
        }

        function appendText(parent, tag, text, className = '') {
            const el = document.createElement(tag);
            el.textContent = text ?? '';
            if (className) el.className = className;
            parent.appendChild(el);
            return el;
        }

        async function loadMenuItems() {
            const listEl = document.getElementById('menu-list');
            listEl.replaceChildren();
            appendText(listEl, 'p', '로딩 중...', 'text-center text-gray-500');

            const { data, error } = await sbClient.from('menu_items').select('*').order('order_index', { ascending: true });
            listEl.replaceChildren();
            if (error) return appendText(listEl, 'p', '데이터 로드 실패', 'text-red-400 text-center');
            if (!data?.length) return appendText(listEl, 'p', '메뉴 없음', 'text-gray-500 text-center text-sm');

            data.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-600';
                const textWrap = document.createElement('div');
                appendText(textWrap, 'span', item.label, 'font-bold text-sm text-gray-200');
                appendText(textWrap, 'span', item.action_id, 'text-xs text-gray-400 block');
                const del = document.createElement('button');
                del.type = 'button';
                del.textContent = '삭제';
                del.className = 'text-red-400 hover:text-red-300 text-xs font-bold px-2';
                del.addEventListener('click', () => deleteMenuItem(item.id));
                row.append(textWrap, del);
                listEl.appendChild(row);
            });
        }

        function safeHttpUrl(value) {
            try {
                const url = new URL(value, location.href);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
            } catch { return null; }
        }

        async function loadSiteAssets() {
            const { data, error } = await sbClient.from('site_assets').select('*').order('key');
            const imgList = document.getElementById('image-asset-list');
            imgList.replaceChildren();
            if (error) return appendText(imgList, 'p', '에셋 로드 실패', 'text-red-400 text-center');

            const titleRow = data.find(r => r.key === 'main_title');
            const subRow = data.find(r => r.key === 'main_subtitle');
            if (titleRow) document.getElementById('site-title-input').value = titleRow.value;
            if (subRow) document.getElementById('site-subtitle-input').value = subRow.value;

            const images = data.filter(r => typeof r.key === 'string' && r.key.startsWith('img_'));
            if (!images.length) return appendText(imgList, 'p', '관리 가능한 이미지가 없습니다.', 'text-sm text-gray-500 text-center');

            images.forEach(img => {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 p-3 rounded border border-gray-600 flex gap-4 items-start';
                const previewWrap = document.createElement('div');
                previewWrap.className = 'w-20 h-20 bg-gray-900 rounded overflow-hidden flex-shrink-0 border border-gray-700';
                const preview = document.createElement('img');
                preview.className = 'w-full h-full object-cover';
                preview.alt = img.description || img.key;
                const imgUrl = safeHttpUrl(img.value);
                if (imgUrl) preview.src = imgUrl;
                previewWrap.appendChild(preview);

                const info = document.createElement('div');
                info.className = 'flex-grow min-w-0';
                appendText(info, 'h4', img.description || img.key, 'font-bold text-sm text-blue-300 truncate');
                appendText(info, 'p', img.key, 'text-xs text-gray-500 mb-2 truncate');
                const controls = document.createElement('div');
                controls.className = 'flex gap-2';
                const upload = document.createElement('button');
                upload.type = 'button';
                upload.textContent = '이미지 변경';
                upload.className = 'bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1 rounded';
                upload.addEventListener('click', () => triggerUpload(img.key));
                controls.appendChild(upload);
                if (imgUrl) {
                    const link = document.createElement('a');
                    link.href = imgUrl;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = '보기 ↗';
                    link.className = 'text-gray-500 text-xs flex items-center hover:text-white';
                    controls.appendChild(link);
                }
                info.appendChild(controls);
                card.append(previewWrap, info);
                imgList.appendChild(card);
            });
        }

        async function updateTextAsset(key, value) {
            const clean = value.trim();
            if (!clean) return;
            const { error } = await sbClient.from('site_assets').upsert([{ key, value: clean }]);
            alert(error ? '저장 실패: ' + error.message : '저장되었습니다!');
        }

        async function addMenuItem() {
            const label = document.getElementById('new-menu-label').value.trim();
            const action = document.getElementById('new-menu-action').value.trim();
            if (!label || !action) return alert('모두 입력해주세요.');
            if (!/^[a-z0-9_-]+$/i.test(action)) return alert('Action ID는 영문, 숫자, -, _만 사용할 수 있습니다.');

            const { error } = await sbClient.from('menu_items').insert([{ label, action_id: action, order_index: 99 }]);
            if (error) return alert('추가 실패: ' + error.message);
            document.getElementById('new-menu-label').value = '';
            document.getElementById('new-menu-action').value = '';
            await loadMenuItems();
        }

        async function deleteMenuItem(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const { error } = await sbClient.from('menu_items').delete().eq('id', id);
            if (error) return alert('삭제 실패: ' + error.message);
            await loadMenuItems();
        }

        function triggerUpload(key) {
            currentUploadKey = key;
            document.getElementById('global-file-input').click();
        }

        async function handleFileSelect(input) {
            const file = input.files?.[0];
            input.value = '';
            if (!file || !currentUploadKey) return;
            if (!file.type.startsWith('image/')) return alert('이미지 파일만 업로드할 수 있습니다.');
            if (file.size > MAX_IMAGE_BYTES) return alert('이미지는 8MB 이하만 업로드할 수 있습니다.');

            const ext = file.name.split('.').pop()?.toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
            const fileName = `${currentUploadKey}_${Date.now()}.${ext}`;
            const { error } = await sbClient.storage.from('retro_assets').upload(fileName, file, { contentType: file.type, upsert: false });
            if (error) return alert('업로드 실패: ' + error.message);

            const { data: publicUrlData } = sbClient.storage.from('retro_assets').getPublicUrl(fileName);
            const newUrl = safeHttpUrl(publicUrlData.publicUrl);
            if (!newUrl) return alert('업로드 URL 검증에 실패했습니다.');

            const { error: dbError } = await sbClient.from('site_assets').update({ value: newUrl }).eq('key', currentUploadKey);
            if (dbError) return alert('DB 업데이트 실패 (이미지는 업로드됨): ' + dbError.message);
            alert('이미지가 변경되었습니다!');
            await loadSiteAssets();
        }

        document.getElementById('admin-pass').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') checkAuth();
        });
        restoreSession();
    </script>
</body>
</html>
